<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterScribe</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --deep-ocean: #0a1628;
            --mid-ocean: #1a2f4f;
            --surface: #2d4a6f;
            --coral: #ff6b9d;
            --seafoam: #4ecdc4;
            --sand: #f7b267;
            --pearl: #f0f4f8;
            --kelp: #2d6a4f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--deep-ocean) 0%, var(--mid-ocean) 50%, var(--surface) 100%);
            color: var(--pearl);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background bubbles */
        .bubble {
            position: fixed;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, rgba(78, 205, 196, 0.3), rgba(78, 205, 196, 0.05));
            border-radius: 50%;
            opacity: 0.6;
            animation: rise 15s infinite ease-in;
            z-index: 0;
        }

        .bubble:nth-child(2) { left: 10%; animation-duration: 12s; animation-delay: 2s; width: 60px; height: 60px; }
        .bubble:nth-child(3) { left: 25%; animation-duration: 18s; animation-delay: 4s; width: 30px; height: 30px; }
        .bubble:nth-child(4) { left: 45%; animation-duration: 14s; animation-delay: 1s; width: 50px; height: 50px; }
        .bubble:nth-child(5) { left: 65%; animation-duration: 16s; animation-delay: 3s; width: 35px; height: 35px; }
        .bubble:nth-child(6) { left: 80%; animation-duration: 13s; animation-delay: 5s; width: 45px; height: 45px; }
        .bubble:nth-child(7) { left: 90%; animation-duration: 20s; animation-delay: 0s; width: 25px; height: 25px; }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0);
            }
            50% {
                transform: translateX(100px);
            }
            100% {
                bottom: 110vh;
                transform: translateX(-100px);
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--seafoam), var(--coral));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: -1px;
            }
        }

        .tagline {
            font-family: 'Space Mono', monospace;
            color: var(--sand);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 15px;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(78, 205, 196, 0.2);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .stat-card {
                padding: 20px;
                border-radius: 15px;
            }
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--coral), var(--seafoam));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--seafoam);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.2);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--sand);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--seafoam);
        }

        @media (max-width: 768px) {
            .stat-value {
                font-size: 2rem;
            }
        }

        .stat-unit {
            font-size: 1rem;
            color: var(--pearl);
            opacity: 0.7;
            margin-left: 5px;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: fadeIn 0.8s ease 0.4s both;
        }

        @media (max-width: 768px) {
            .tabs {
                gap: 10px;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 10px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(78, 205, 196, 0.3);
            color: var(--pearl);
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            min-width: fit-content;
        }

        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(135deg, var(--coral), var(--seafoam));
            border-color: transparent;
            color: var(--deep-ocean);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(78, 205, 196, 0.15);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
        }

        @media (max-width: 768px) {
            .section {
                padding: 20px;
                border-radius: 20px;
            }
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--seafoam);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .section-title {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 30px;
            background: linear-gradient(135deg, var(--coral), var(--seafoam));
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--sand);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--pearl);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--seafoam);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, var(--coral), var(--seafoam));
            color: var(--deep-ocean);
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--pearl);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff3742);
            color: white;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 15px;
        }

        .log-container {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .log-container {
                max-height: 400px;
            }
        }

        .log-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(78, 205, 196, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .log-item:hover {
            border-color: rgba(78, 205, 196, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        .log-timestamp {
            color: var(--sand);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .log-content {
            color: var(--pearl);
            line-height: 1.6;
        }

        .log-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .log-item:hover .log-actions {
            opacity: 1;
        }

        /* Chart container */
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(78, 205, 196, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            position: relative;
            height: 400px;
        }

        @media (max-width: 768px) {
            .chart-container {
                height: 300px;
                padding: 15px;
            }
        }

        .chart-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .chart-controls {
                flex-direction: column;
            }
        }

        .chart-controls button {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 15px;
            color: var(--pearl);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .chart-controls button:hover,
        .chart-controls button.active {
            background: var(--seafoam);
            color: var(--deep-ocean);
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(78, 205, 196, 0.3);
            border-top: 3px solid var(--seafoam);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error messages */
        .error {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #ff4757;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .success {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid rgba(78, 205, 196, 0.5);
            color: var(--seafoam);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--deep-ocean), var(--mid-ocean));
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 25px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                max-width: 95%;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--seafoam);
        }

        .close {
            background: none;
            border: none;
            color: var(--pearl);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Responsive improvements */
        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                justify-content: center;
            }
            
            .tab-btn {
                padding: 10px 16px;
                font-size: 0.8rem;
            }
        }

        /* PWA-ready styles */
        @media (display-mode: standalone) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <!-- Background bubbles -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
        <header>
            <h1>WaterScribe</h1>
            <p class="tagline">Aquarium Management System</p>
        </header>

        <div class="dashboard" id="dashboard">
            <!-- Stats will be populated here -->
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('parameters')">Parameters</button>
            <button class="tab-btn" onclick="showTab('charts')">Charts</button>
            <button class="tab-btn" onclick="showTab('schedule')">Schedule</button>
            <button class="tab-btn" onclick="showTab('maintenance')">Maintenance</button>
            <button class="tab-btn" onclick="showTab('fish')">Fish</button>
        </div>

        <!-- Parameters Tab -->
        <div id="tab-parameters" class="tab-content active">
            <div class="section">
                <h2 class="section-title">Water Parameters</h2>
                <form id="parameters-form" class="form-grid">
                    <div class="form-group">
                        <label for="temperature">Temperature (°F)</label>
                        <input type="number" name="temperature" step="0.1" placeholder="78.5">
                    </div>
                    <div class="form-group">
                        <label for="ph">pH Level</label>
                        <input type="number" name="ph" step="0.1" min="0" max="14" placeholder="7.2">
                    </div>
                    <div class="form-group">
                        <label for="ammonia">Ammonia (ppm)</label>
                        <input type="number" name="ammonia" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="nitrite">Nitrite (ppm)</label>
                        <input type="number" name="nitrite" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="nitrate">Nitrate (ppm)</label>
                        <input type="number" name="nitrate" step="0.1" min="0" placeholder="10.0">
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea name="notes" placeholder="Any observations or notes..."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">Log Parameters</button>
                    </div>
                </form>
                <div id="parameters-log" class="log-container"></div>
            </div>
        </div>

        <!-- Charts Tab -->
        <div id="tab-charts" class="tab-content">
            <div class="section">
                <h2 class="section-title">Parameter Trends</h2>
                <div class="chart-controls">
                    <button onclick="loadChart(7)" class="chart-period">7 Days</button>
                    <button onclick="loadChart(30)" class="chart-period active">30 Days</button>
                    <button onclick="loadChart(90)" class="chart-period">90 Days</button>
                </div>
                <div class="chart-container">
                    <canvas id="parametersChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Schedule Tab -->
        <div id="tab-schedule" class="tab-content">
            <div class="section">
                <h2 class="section-title">Scheduled Tasks</h2>
                <form id="schedule-form" class="form-grid">
                    <div class="form-group">
                        <label for="task-name">Task Name</label>
                        <input type="text" name="task_name" required placeholder="Water change, filter cleaning, etc.">
                    </div>
                    <div class="form-group">
                        <label for="task-type">Task Type</label>
                        <select name="task_type" id="task-type-select" onchange="toggleTaskType()">
                            <option value="recurring">Recurring</option>
                            <option value="one-time">One-time</option>
                        </select>
                    </div>
                    <div class="form-group" id="frequency-group">
                        <label for="frequency">Frequency (days)</label>
                        <input type="number" name="frequency_days" id="frequency-input" placeholder="7" min="1">
                    </div>
                    <div class="form-group" id="date-group" style="display: none;">
                        <label for="specific-date">Date</label>
                        <input type="date" name="specific_date" id="date-input">
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea name="description" placeholder="Additional details..."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">Add Task</button>
                    </div>
                </form>
                <div id="scheduled-tasks" class="log-container"></div>
            </div>
        </div>

        <!-- Maintenance Tab -->
        <div id="tab-maintenance" class="tab-content">
            <div class="section">
                <h2 class="section-title">Maintenance Log</h2>
                <form id="maintenance-form" class="form-grid">
                    <div class="form-group">
                        <label for="task-type">Task Type</label>
                        <select name="task_type" required>
                            <option value="">Select task type...</option>
                            <option value="Water Change">Water Change</option>
                            <option value="Filter Cleaning">Filter Cleaning</option>
                            <option value="Glass Cleaning">Glass Cleaning</option>
                            <option value="Gravel Vacuum">Gravel Vacuum</option>
                            <option value="Equipment Check">Equipment Check</option>
                            <option value="Plant Trimming">Plant Trimming</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea name="description" required placeholder="Details about the maintenance performed..."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">Log Maintenance</button>
                    </div>
                </form>
                <div id="maintenance-log" class="log-container"></div>
            </div>
        </div>

        <!-- Fish Tab -->
        <div id="tab-fish" class="tab-content">
            <div class="section">
                <h2 class="section-title">Fish Inventory</h2>
                <form id="fish-form" class="form-grid">
                    <div class="form-group">
                        <label for="species">Species</label>
                        <input type="text" name="species" required placeholder="Betta splendens">
                    </div>
                    <div class="form-group">
                        <label for="common-name">Common Name</label>
                        <input type="text" name="common_name" placeholder="Betta fish">
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" name="quantity" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea name="notes" placeholder="Color, behavior, feeding notes..."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">Add Fish</button>
                    </div>
                </form>
                <div id="fish-inventory" class="log-container"></div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Edit Entry</h3>
                <button class="close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm" class="form-grid">
                <div id="editFields"></div>
                <div class="form-group">
                    <button type="submit" class="btn">Save Changes</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let chart = null;
        let currentEditType = null;
        let currentEditId = null;

        // API helper function
        async function api(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                }
            };
            
            if (data) {
                options.body = JSON.stringify(data);
            }
            
            const response = await fetch(endpoint, options);
            return response.json();
        }

        // Show/hide tabs
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
            
            // Load data for the active tab
            if (tabName === 'parameters') {
                loadParameters();
            } else if (tabName === 'charts') {
                loadChart(30);
            } else if (tabName === 'schedule') {
                loadScheduledTasks();
            } else if (tabName === 'maintenance') {
                loadMaintenance();
            } else if (tabName === 'fish') {
                loadFish();
            }
        }

        // Load dashboard stats
        async function loadDashboard() {
            try {
                const stats = await api('/api/stats');
                const dashboard = document.getElementById('dashboard');
                
                dashboard.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Temperature</div>
                        <div class="stat-value">
                            ${stats.latest_parameters?.temperature || '--'}
                            <span class="stat-unit">°F</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">pH Level</div>
                        <div class="stat-value">
                            ${stats.latest_parameters?.ph || '--'}
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Fish</div>
                        <div class="stat-value">
                            ${stats.total_fish}
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Upcoming Tasks</div>
                        <div class="stat-value">
                            ${stats.upcoming_tasks}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }

        // Load parameters
        async function loadParameters() {
            try {
                const data = await api('/api/parameters');
                const container = document.getElementById('parameters-log');
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No parameters recorded yet.</p>';
                    return;
                }
                
                container.innerHTML = data.map(item => `
                    <div class="log-item">
                        <div class="log-actions">
                            <button class="btn btn-small btn-secondary" onclick="editParameters(${item.id})">Edit</button>
                            <button class="btn btn-small btn-danger" onclick="deleteParameters(${item.id})">Delete</button>
                        </div>
                        <div class="log-timestamp">${new Date(item.timestamp).toLocaleString()}</div>
                        <div class="log-content">
                            <strong>Temperature:</strong> ${item.temperature || 'N/A'}°F &nbsp;
                            <strong>pH:</strong> ${item.ph || 'N/A'} &nbsp;
                            <strong>Ammonia:</strong> ${item.ammonia || 'N/A'}ppm &nbsp;
                            <strong>Nitrite:</strong> ${item.nitrite || 'N/A'}ppm &nbsp;
                            <strong>Nitrate:</strong> ${item.nitrate || 'N/A'}ppm
                            ${item.notes ? `<br><br><strong>Notes:</strong> ${item.notes}` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load parameters:', error);
            }
        }

        // Load chart
        async function loadChart(days) {
            try {
                // Update active button
                document.querySelectorAll('.chart-period').forEach(btn => {
                    btn.classList.remove('active');
                });
                event?.target?.classList.add('active');
                
                const data = await api(`/api/parameters/chart?days=${days}`);
                
                const ctx = document.getElementById('parametersChart').getContext('2d');
                
                if (chart) {
                    chart.destroy();
                }
                
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [
                            {
                                ...data.datasets.temperature,
                                fill: false,
                                tension: 0.3
                            },
                            {
                                ...data.datasets.ph,
                                fill: false,
                                tension: 0.3
                            },
                            {
                                ...data.datasets.ammonia,
                                fill: false,
                                tension: 0.3
                            },
                            {
                                ...data.datasets.nitrite,
                                fill: false,
                                tension: 0.3
                            },
                            {
                                ...data.datasets.nitrate,
                                fill: false,
                                tension: 0.3
                            }
                        ].filter(dataset => dataset.data.some(val => val !== null))
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#f0f4f8'
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    color: 'rgba(78, 205, 196, 0.1)'
                                },
                                ticks: {
                                    color: '#f0f4f8'
                                }
                            },
                            y: {
                                grid: {
                                    color: 'rgba(78, 205, 196, 0.1)'
                                },
                                ticks: {
                                    color: '#f0f4f8'
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Failed to load chart:', error);
                document.getElementById('parametersChart').getContext('2d').clearRect(0, 0, 400, 300);
            }
        }

        // Edit functions
        function editParameters(id) {
            api(`/api/parameters`)
                .then(data => {
                    const item = data.find(p => p.id === id);
                    if (!item) return;
                    
                    currentEditType = 'parameters';
                    currentEditId = id;
                    
                    document.getElementById('editFields').innerHTML = `
                        <div class="form-group">
                            <label>Temperature (°F)</label>
                            <input type="number" name="temperature" step="0.1" value="${item.temperature || ''}">
                        </div>
                        <div class="form-group">
                            <label>pH Level</label>
                            <input type="number" name="ph" step="0.1" value="${item.ph || ''}">
                        </div>
                        <div class="form-group">
                            <label>Ammonia (ppm)</label>
                            <input type="number" name="ammonia" step="0.01" value="${item.ammonia || ''}">
                        </div>
                        <div class="form-group">
                            <label>Nitrite (ppm)</label>
                            <input type="number" name="nitrite" step="0.01" value="${item.nitrite || ''}">
                        </div>
                        <div class="form-group">
                            <label>Nitrate (ppm)</label>
                            <input type="number" name="nitrate" step="0.1" value="${item.nitrate || ''}">
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <textarea name="notes">${item.notes || ''}</textarea>
                        </div>
                    `;
                    
                    document.getElementById('editModal').classList.add('active');
                });
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditType = null;
            currentEditId = null;
        }

        // Delete functions
        async function deleteParameters(id) {
            if (!confirm('Are you sure you want to delete this parameter reading?')) return;
            
            try {
                await api(`/api/parameters?id=${id}`, 'DELETE');
                loadParameters();
                loadDashboard();
                showMessage('Parameter reading deleted successfully', 'success');
            } catch (error) {
                showMessage('Failed to delete parameter reading', 'error');
            }
        }

        // Load other sections (simplified versions)
        async function loadScheduledTasks() {
            try {
                const data = await api('/api/scheduled');
                const container = document.getElementById('scheduled-tasks');
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No scheduled tasks.</p>';
                    return;
                }
                
                container.innerHTML = data.map(item => `
                    <div class="log-item">
                        <div class="log-actions">
                            <button class="btn btn-small btn-secondary" onclick="completeTask(${item.id}, '${item.task_name}')">Complete</button>
                            <button class="btn btn-small btn-danger" onclick="deleteTask(${item.id})">Delete</button>
                        </div>
                        <div class="log-timestamp">Due: ${new Date(item.next_due).toLocaleDateString()}</div>
                        <div class="log-content">
                            <strong>${item.task_name}</strong>
                            ${item.description ? `<br>${item.description}` : ''}
                            <br><small>${item.is_recurring ? `Recurring every ${item.frequency_days} days` : 'One-time task'}</small>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load scheduled tasks:', error);
            }
        }

        async function loadMaintenance() {
            try {
                const data = await api('/api/maintenance');
                const container = document.getElementById('maintenance-log');
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No maintenance records.</p>';
                    return;
                }
                
                container.innerHTML = data.map(item => `
                    <div class="log-item">
                        <div class="log-actions">
                            <button class="btn btn-small btn-danger" onclick="deleteMaintenance(${item.id})">Delete</button>
                        </div>
                        <div class="log-timestamp">${new Date(item.timestamp).toLocaleString()}</div>
                        <div class="log-content">
                            <strong>${item.task_type}</strong>
                            ${item.description ? `<br>${item.description}` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load maintenance:', error);
            }
        }

        async function loadFish() {
            try {
                const data = await api('/api/fish');
                const container = document.getElementById('fish-inventory');
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No fish recorded.</p>';
                    return;
                }
                
                container.innerHTML = data.map(item => `
                    <div class="log-item">
                        <div class="log-actions">
                            <button class="btn btn-small btn-secondary" onclick="editFish(${item.id})">Edit</button>
                            <button class="btn btn-small btn-danger" onclick="deleteFish(${item.id})">Delete</button>
                        </div>
                        <div class="log-timestamp">Added: ${new Date(item.added_date).toLocaleDateString()}</div>
                        <div class="log-content">
                            <strong>${item.species}</strong> ${item.common_name ? `(${item.common_name})` : ''}
                            <br>Quantity: ${item.quantity}
                            ${item.notes ? `<br><br>${item.notes}` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load fish:', error);
            }
        }

        // Form handlers
        document.getElementById('parameters-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {};
            
            for (const [key, value] of formData.entries()) {
                if (value.trim()) {
                    data[key] = key === 'notes' ? value : parseFloat(value);
                }
            }
            
            try {
                const result = await api('/api/parameters', 'POST', data);
                if (result.success) {
                    e.target.reset();
                    loadParameters();
                    loadDashboard();
                    showMessage('Parameters logged successfully', 'success');
                } else {
                    showMessage(result.errors ? result.errors.join(', ') : 'Failed to log parameters', 'error');
                }
            } catch (error) {
                showMessage('Failed to log parameters', 'error');
            }
        });

        document.getElementById('schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                task_name: formData.get('task_name'),
                description: formData.get('description'),
                is_recurring: formData.get('task_type') === 'recurring'
            };
            
            if (data.is_recurring) {
                data.frequency_days = parseInt(formData.get('frequency_days'));
            } else {
                data.specific_date = formData.get('specific_date');
            }
            
            try {
                const result = await api('/api/scheduled', 'POST', data);
                if (result.success) {
                    e.target.reset();
                    loadScheduledTasks();
                    loadDashboard();
                    showMessage('Task scheduled successfully', 'success');
                } else {
                    showMessage(result.error || 'Failed to schedule task', 'error');
                }
            } catch (error) {
                showMessage('Failed to schedule task', 'error');
            }
        });

        document.getElementById('maintenance-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                task_type: formData.get('task_type'),
                description: formData.get('description')
            };
            
            try {
                const result = await api('/api/maintenance', 'POST', data);
                if (result.success) {
                    e.target.reset();
                    loadMaintenance();
                    loadDashboard();
                    showMessage('Maintenance logged successfully', 'success');
                } else {
                    showMessage('Failed to log maintenance', 'error');
                }
            } catch (error) {
                showMessage('Failed to log maintenance', 'error');
            }
        });

        document.getElementById('fish-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                species: formData.get('species'),
                common_name: formData.get('common_name'),
                quantity: parseInt(formData.get('quantity')),
                notes: formData.get('notes')
            };
            
            try {
                const result = await api('/api/fish', 'POST', data);
                if (result.success) {
                    e.target.reset();
                    loadFish();
                    loadDashboard();
                    showMessage('Fish added successfully', 'success');
                } else {
                    showMessage(result.error || 'Failed to add fish', 'error');
                }
            } catch (error) {
                showMessage('Failed to add fish', 'error');
            }
        });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentEditType || !currentEditId) return;
            
            const formData = new FormData(e.target);
            const data = { id: currentEditId };
            
            for (const [key, value] of formData.entries()) {
                if (key !== 'id') {
                    data[key] = value.trim() ? (key === 'notes' || key === 'species' || key === 'common_name' || key === 'task_type' || key === 'description' ? value : parseFloat(value)) : null;
                }
            }
            
            try {
                const result = await api(`/api/${currentEditType}`, 'PUT', data);
                if (result.success) {
                    closeEditModal();
                    
                    // Reload appropriate data
                    if (currentEditType === 'parameters') {
                        loadParameters();
                        loadDashboard();
                    } else if (currentEditType === 'fish') {
                        loadFish();
                        loadDashboard();
                    }
                    
                    showMessage('Entry updated successfully', 'success');
                } else {
                    showMessage(result.errors ? result.errors.join(', ') : 'Failed to update entry', 'error');
                }
            } catch (error) {
                showMessage('Failed to update entry', 'error');
            }
        });

        // Helper functions
        function toggleTaskType() {
            const taskType = document.getElementById('task-type-select').value;
            const frequencyGroup = document.getElementById('frequency-group');
            const dateGroup = document.getElementById('date-group');
            
            if (taskType === 'recurring') {
                frequencyGroup.style.display = 'block';
                dateGroup.style.display = 'none';
            } else {
                frequencyGroup.style.display = 'none';
                dateGroup.style.display = 'block';
            }
        }

        async function completeTask(id, taskName) {
            try {
                await api('/api/scheduled', 'PUT', { id, task_name: taskName });
                loadScheduledTasks();
                loadDashboard();
                showMessage('Task completed', 'success');
            } catch (error) {
                showMessage('Failed to complete task', 'error');
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            
            try {
                await api(`/api/scheduled?id=${id}`, 'DELETE');
                loadScheduledTasks();
                loadDashboard();
                showMessage('Task deleted', 'success');
            } catch (error) {
                showMessage('Failed to delete task', 'error');
            }
        }

        async function deleteMaintenance(id) {
            if (!confirm('Are you sure you want to delete this maintenance record?')) return;
            
            try {
                await api(`/api/maintenance?id=${id}`, 'DELETE');
                loadMaintenance();
                showMessage('Maintenance record deleted', 'success');
            } catch (error) {
                showMessage('Failed to delete maintenance record', 'error');
            }
        }

        function editFish(id) {
            api('/api/fish')
                .then(data => {
                    const item = data.find(f => f.id === id);
                    if (!item) return;
                    
                    currentEditType = 'fish';
                    currentEditId = id;
                    
                    document.getElementById('editFields').innerHTML = `
                        <div class="form-group">
                            <label>Species</label>
                            <input type="text" name="species" value="${item.species}" required>
                        </div>
                        <div class="form-group">
                            <label>Common Name</label>
                            <input type="text" name="common_name" value="${item.common_name || ''}">
                        </div>
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" name="quantity" value="${item.quantity}" min="1" required>
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <textarea name="notes">${item.notes || ''}</textarea>
                        </div>
                    `;
                    
                    document.getElementById('editModal').classList.add('active');
                });
        }

        async function deleteFish(id) {
            if (!confirm('Are you sure you want to delete this fish?')) return;
            
            try {
                await api(`/api/fish?id=${id}`, 'DELETE');
                loadFish();
                loadDashboard();
                showMessage('Fish deleted', 'success');
            } catch (error) {
                showMessage('Failed to delete fish', 'error');
            }
        }

        function showMessage(message, type) {
            const existingMessage = document.querySelector('.error, .success');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const messageEl = document.createElement('div');
            messageEl.className = type;
            messageEl.textContent = message;
            
            // Insert at the top of the active tab
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab) {
                const firstSection = activeTab.querySelector('.section');
                if (firstSection) {
                    firstSection.insertBefore(messageEl, firstSection.firstChild);
                    
                    setTimeout(() => {
                        messageEl.remove();
                    }, 5000);
                }
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            loadParameters();
            
            // Close modal when clicking outside
            document.getElementById('editModal').addEventListener('click', (e) => {
                if (e.target.id === 'editModal') {
                    closeEditModal();
                }
            });
        });
    </script>
</body>
</html>
