# /static: a URL with ?v=<content hash> (added by the app) never changes content -> a year, immutable.
# Anything requested without one gets a short lifetime. sw.js and the manifest are served by the app
# (no-cache), not from here.
map $arg_v $waterscribe_static_cache {
    "~^[0-9a-f]{10}$"  "public, max-age=31536000, immutable";
    default            "public, max-age=300";
}

server {
    listen 80;
    listen 443 ssl;
    include snippets/robix-tls.conf;
    server_name waterscribe.robix;
    
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /static/ {
        alias /home/rcampbell/aquarium-tracker/aquarium-tracker/app/static/;
        add_header Cache-Control $waterscribe_static_cache;
    }
}
